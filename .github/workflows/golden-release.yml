# Manual release gate: re-run no-hardware (ttis) + hardware validation, then publish
# golden.json (with test-sha) and per-distro .ttis files as a GitHub Release.
#
# Dispatch from main after golden.json changes have merged and routine CI is green.
# Tags are date-based: vYYYY.MM.DD (with -N for same-day re-releases).
name: Golden — release
run-name: Golden release · ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why you are cutting a release (optional)
        required: false
        type: string

concurrency:
  group: golden-release-${{ github.ref }}
  cancel-in-progress: true

# Reusable children declare actions: write (skip-duplicate). Callers must grant it
# or GitHub rejects the call ("requesting actions: write, but … actions: none").
permissions:
  contents: read
  actions: write

jobs:
  ttis:
    name: No-hardware validation
    uses: ./.github/workflows/golden-ttis.yml
    permissions:
      actions: write
      contents: read

  hw:
    name: Hardware validation
    uses: ./.github/workflows/golden-hw.yml
    permissions:
      actions: write
      contents: read

  release:
    name: Publish golden release
    needs: [ttis, hw]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # download-artifact from ttis jobs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exported .ttis files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ttis-*
          merge-multiple: true

      - name: Assemble release payload
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.ttis' -exec cp -t release/ {} +
          jq --arg sha "${TEST_SHA}" '. + {"test-sha": $sha}' golden.json > release/golden.json
          echo "Release payload:"
          ls -1 release
          jq . release/golden.json

      - name: Derive release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          BASE="v$(date -u +%Y.%m.%d)"
          SUFFIX=0
          TAG="${BASE}"
          while gh release view "${TAG}" >/dev/null 2>&1; do
            SUFFIX=$((SUFFIX + 1))
            TAG="${BASE}-${SUFFIX}"
          done
          {
            echo "tag=${TAG}"
            echo "body<<EOF"
            if [[ -n "${REASON}" ]]; then
              echo "${REASON}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.tag.outputs.body }}
          files: |
            release/golden.json
            release/*.ttis
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
