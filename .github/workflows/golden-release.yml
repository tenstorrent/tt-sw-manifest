# Manual release gate: re-run no-hardware (ttis) + hardware validation, then publish
# golden.json (with test-sha) and per-distro .ttis files as a GitHub Release.
#
# Dispatch from main after golden.json changes have merged and routine CI is green.
# Choose major / minor / patch at dispatch time; tags are semver (v1.0.0, …).
# Legacy date tags (v2026.06.26) are ignored when computing the next version.
name: Golden — release
run-name: Golden release · ${{ inputs.bump }} · ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (first cut → pick major for v1.0.0)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      reason:
        description: Why you are cutting a release (optional)
        required: false
        type: string

concurrency:
  group: golden-release-${{ github.ref }}
  cancel-in-progress: true

# Top-level defaults. Reusable child workflows declare actions: write (skip-duplicate);
# callers must grant at least that, or GitHub rejects the call with
# "requesting actions: write, but is only allowed actions: none".
permissions:
  contents: read
  actions: write

jobs:
  ttis:
    name: No-hardware validation
    uses: ./.github/workflows/golden-ttis.yml
    permissions:
      actions: write
      contents: read

  hw:
    name: Hardware validation
    uses: ./.github/workflows/golden-hw.yml
    permissions:
      actions: write
      contents: read

  release:
    name: Publish golden release
    needs: [ttis, hw]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # download-artifact from ttis jobs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exported .ttis files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ttis-*
          merge-multiple: true

      - name: Assemble release payload
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.ttis' -exec cp -t release/ {} +
          jq --arg sha "${TEST_SHA}" '. + {"test-sha": $sha}' golden.json > release/golden.json
          echo "Release payload:"
          ls -1 release
          jq . release/golden.json

      - name: Derive semver release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # Prefer git tags; ignore legacy date tags (vYYYY.MM.DD).
          git fetch --tags --force >/dev/null 2>&1 || true
          LATEST="$(
            git tag -l 'v*.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vE '^v20[0-9]{2}\.' \
              | sort -V \
              | tail -1 \
              || true
          )"
          if [[ -z "${LATEST}" ]]; then
            MAJOR=0
            MINOR=0
            PATCH=0
            echo "No prior semver tag; starting from v0.0.0 (bump=${BUMP})"
          else
            echo "Latest semver tag: ${LATEST}"
            VER="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<<"${VER}"
          fi

          case "${BUMP}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unknown bump: ${BUMP}" >&2
              exit 1
              ;;
          esac

          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: release ${TAG} already exists" >&2
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "bump=${BUMP}"
            echo "body<<EOF"
            echo "Semver bump: **${BUMP}** → \`${TAG}\`"
            if [[ -n "${REASON}" ]]; then
              echo
              echo "${REASON}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${TAG} (bump=${BUMP})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.tag.outputs.body }}
          files: |
            release/golden.json
            release/*.ttis
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
