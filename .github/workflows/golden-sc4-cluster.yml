# SC4 cluster tests on the BH super cluster, driven from the head node.
#
# The head node (label super_cluster_head_node) is the "starter": it runs the
# job and reaches the other hosts with passwordless SSH + mpirun, the way
# tt-metal's tools/scaleout/exabox scripts expect (no Kubernetes). Tests run
# from the exabox-tools image, so tt-metal is not built on the hosts.
#
# Brought up one step at a time (PT-628):
#   0. Preflight: SSH, OpenMPI, Docker, image, scaleout descriptors
#   1. SC4 health: physical discovery + system health               <- now
#   2. Validation: run_validation.sh
#   3. Fabric: run_fabric_tests.sh
name: Golden — SC4 cluster
run-name: SC4 cluster · ${{ github.event_name }}

on:
  push:
    branches:
      - sc4-cluster-tests
  workflow_dispatch:

concurrency:
  group: golden-sc4-cluster
  cancel-in-progress: false

permissions:
  contents: read

env:
  # All eight nodes. Which four form each SC4 quad comes out of preflight
  # (deployment descriptor) and physical discovery.
  SC4_HOSTS: bh-glx-120-a02u02,bh-glx-120-a02u08,bh-glx-120-a03u02,bh-glx-120-a03u08,bh-glx-120-a04u02,bh-glx-120-a04u08,bh-glx-120-a05u02,bh-glx-120-a05u08
  EXABOX_IMAGE: ghcr.io/tenstorrent/tt-metal/exabox-tools:latest

jobs:
  preflight:
    name: SC4 preflight
    runs-on: [self-hosted, super_cluster_head_node]
    timeout-minutes: 60
    steps:
      # The golden hw workflows share this workspace and leave root-owned
      # reset artifacts that checkout cannot delete.
      - name: Remove root-owned reset artifacts
        run: sudo rm -rf "${GITHUB_WORKSPACE}/nvme-reset-check"

      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      - name: Preflight (SSH, OpenMPI, Docker, image, descriptors)
        run: bash .github/scripts/sc4-preflight.sh

  health:
    name: SC4 health (physical discovery + system health)
    needs: preflight
    runs-on: [self-hosted, super_cluster_head_node]
    timeout-minutes: 60
    steps:
      - name: Remove root-owned reset artifacts
        run: sudo rm -rf "${GITHUB_WORKSPACE}/nvme-reset-check"

      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      # Use the exabox scripts from the same tt-metal commit as the image.
      - name: Resolve the image's tt-metal revision
        id: image
        run: |
          docker pull -q "${EXABOX_IMAGE}"
          rev=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${EXABOX_IMAGE}")
          echo "tt-metal revision: ${rev}"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-metal exabox scripts
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.image.outputs.rev }}
          path: tt-metal
          sparse-checkout: tools/scaleout/exabox

      - name: Reset, physical discovery, system health
        working-directory: tt-metal
        env:
          SC4_LOG_DIR: ${{ github.workspace }}/sc4-logs/health
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/sc4-health.sh"

      - name: Upload health logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc4-health-logs
          path: ${{ github.workspace }}/sc4-logs/health
          if-no-files-found: warn
