# Install the golden stack on every BH super cluster node, verify versions,
# stress-test tt-smi reset and take an SMI snapshot. Same steps as
# golden-hw.yml, minus the metal upstream tests.
#
# Each node runs its own job. Runners carry the pool label
# super_cluster_bh_node plus their hostname as a label, so a job can be pinned
# to one node. GOLDEN_RUNNER_LABEL is always the pool label, which the scripts
# map to a rev C Galaxy (tt-smi -glx_reset).
name: Golden — hardware (super cluster)
run-name: Golden hw super cluster · ${{ github.event_name }}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    paths:
      - golden.json
      - .github/workflows/golden-hw-supercluster.yml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      reason:
        description: Why you are running this workflow (optional)
        required: false
        type: string
  workflow_call:

concurrency:
  group: golden-hw-supercluster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write # skip-duplicate-actions (query/cancel workflow runs)
  contents: read

env:
  GOLDEN_RUNNER_LABEL: super_cluster_bh_node

jobs:
  # Skip the post-merge push run when the PR already passed on the same tree.
  pre_job:
    name: Skip duplicate check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.set.outputs.should_skip }}
    steps:
      - id: skip_check
        if: github.event_name == 'push'
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - id: set
        run: echo "should_skip=${{ steps.skip_check.outputs.should_skip || 'false' }}" >> "$GITHUB_OUTPUT"

  golden-hw-supercluster:
    name: Golden hw (${{ matrix.node }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: [self-hosted, super_cluster_bh_node, "${{ matrix.node }}"]
    strategy:
      fail-fast: false
      matrix:
        node:
          - bh-glx-120-a02u02 # head node (also super_cluster_head_node)
          - bh-glx-120-a02u08
          - bh-glx-120-a03u02
          - bh-glx-120-a03u08
          - bh-glx-120-a04u02
          - bh-glx-120-a04u08
          - bh-glx-120-a05u02
          - bh-glx-120-a05u08

    steps:
      # smi-reset.sh runs under sudo and writes nvme-reset-check into the
      # workspace. A later checkout cannot unlink those root-owned files.
      - name: Remove root-owned reset artifacts
        run: sudo rm -rf "${GITHUB_WORKSPACE}/nvme-reset-check"

      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install golden stack (tt-installer)
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
        run: |
          for i in {1..60}; do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "Waiting for apt lock..."
            sleep 5
          done
          echo "Flashing firmware to the golden.json pin via tt-flash"
          sudo env \
            GOLDEN_JSON="${GOLDEN_JSON}" \
            GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
            bash .github/scripts/golden-install.sh --hw --force-flash

      - name: Verify installed smi matches golden.json
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          VENV_DIR: /root/.tenstorrent-venv
        run: sudo -E env GOLDEN_JSON="${GOLDEN_JSON}" VENV_DIR="${VENV_DIR}" bash .github/scripts/verify-versions.sh

      - name: Galaxy reset stress (10x, installer tt-smi)
        env:
          VENV_DIR: /root/.tenstorrent-venv
          NUM_RESETS: "10"
          # NVMe/RAID health is compared before and after each reset.
          NVME_CHECK_ROOT: ${{ github.workspace }}/nvme-reset-check
        run: sudo -E env VENV_DIR="${VENV_DIR}" NUM_RESETS="${NUM_RESETS}" GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" NVME_CHECK_ROOT="${NVME_CHECK_ROOT}" bash .github/scripts/smi-reset.sh

      - name: Return reset artifacts to the runner user
        if: always()
        run: |
          if [[ -e "${GITHUB_WORKSPACE}/nvme-reset-check" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/nvme-reset-check"
          fi

      - name: Upload reset timing and NVMe check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvme-reset-check-${{ matrix.node }}
          path: ${{ github.workspace }}/nvme-reset-check
          if-no-files-found: ignore

      - name: SMI snapshot (tt-smi -s)
        env:
          VENV_DIR: /root/.tenstorrent-venv
        run: sudo -E env VENV_DIR="${VENV_DIR}" bash .github/scripts/smi-snapshot.sh
