# Install golden stack on self-hosted runners, verify versions, stress-test tt-smi reset,
# record platform firmware, ttnn unit test (tt-metalium release), and metal upstream
# (upstream-tests-bh). Runners mirror tenstorrent/tt-smi/.github/workflows/test.yml
# (test-hardware job).
#
# The BH super cluster nodes run as their own job (golden-hw-sc) with the same
# steps, minus metal upstream (a single-host suite). As soon as every super
# cluster node has passed, the SC4 cluster tests (golden-sc4-cluster.yml) start
# from the head node: health, validation and fabric. They do not wait for the
# single-host machines.
#
# Runs on push to main / renovate/**, PRs touching golden files, workflow_dispatch,
# or when called by golden-release.yml.
# Self-hosted runners may log "sudo: unable to resolve host ubuntu" when hostname is not in
# /etc/hosts — harmless. To silence: echo "127.0.0.1 ubuntu" | sudo tee -a /etc/hosts
name: Golden — hardware
run-name: Golden hw · ${{ github.event_name }}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    paths:
      - golden.json
      - .github/workflows/golden-ttis.yml
      - .github/workflows/golden-hw.yml
      - .github/workflows/golden-sc4-cluster.yml
      - .github/workflows/golden-release.yml
      - .github/workflows/renovate.yml
      - .github/scripts/**
      - .github/sc4/**
      - tests/metalium-workload.py
  workflow_dispatch:
    inputs:
      reason:
        description: Why you are running this workflow (optional)
        required: false
        type: string
  workflow_call:

concurrency:
  group: golden-hw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write # skip-duplicate-actions (query/cancel workflow runs)
  contents: read

jobs:
  # After a clean rebase+merge, main has the same tree as the PR tip. Skip the
  # post-merge push run when that PR (or any earlier run) already succeeded on
  # the same content. See fkirc/skip-duplicate-actions same_content_newer.
  # Later: add paths_ignore here if merge-only files should not force a re-run.
  pre_job:
    name: Skip duplicate check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.set.outputs.should_skip }}
    steps:
      - id: skip_check
        # Only consider skipping pushes (typically main after merge). Always run
        # on pull_request / workflow_dispatch / workflow_call (release gate).
        if: github.event_name == 'push'
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - id: set
        run: echo "should_skip=${{ steps.skip_check.outputs.should_skip || 'false' }}" >> "$GITHUB_OUTPUT"

  golden-hw-integration:
    name: Golden hw (${{ matrix.runner }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.labels }}
    strategy:
      fail-fast: false
      matrix:
        # runner: job and artifact name; labels: runs-on; label: GOLDEN_RUNNER_LABEL,
        # which the scripts map to a board type.
        include:
          - { runner: p100a, labels: [p100a], label: p100a } # syseng-gh-01
          - { runner: p150a, labels: [p150a], label: p150a } # syseng-gh-03
          - { runner: p300a, labels: [p300a], label: p300a } # yyz-zephyr-01
          - { runner: quietbox2, labels: [quietbox2], label: quietbox2 } # BH QuietBox
          - { runner: bh-galaxy-revc, labels: [bh-galaxy-revc], label: bh-galaxy-revc } # BH Galaxy (shared with system FW)

    # Shared with golden-hw-sc below (YAML anchor), so both run the same steps.
    steps: &node-steps
      # smi-reset.sh runs under sudo and writes nvme-reset-check into the
      # workspace. A later checkout cannot unlink those root-owned files.
      - name: Remove root-owned reset artifacts
        run: sudo rm -rf "${GITHUB_WORKSPACE}/nvme-reset-check" "${GITHUB_WORKSPACE}/platform-fw"

      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      # Some hosts (the BH super cluster) default to umask 027. A tt-installer
      # run there leaves its apt key and source list 0640, which _apt cannot
      # read, and every later apt-get update fails with "Unknown error executing apt-key".
      - name: Make the Tenstorrent apt key readable
        run: |
          for f in /etc/apt/keyrings/tt-pkg-key.asc /etc/apt/sources.list.d/tenstorrent.list; do
            if sudo test -e "${f}"; then sudo chmod 644 "${f}"; fi
          done

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install golden stack (tt-installer)
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          GOLDEN_RUNNER_LABEL: ${{ matrix.label }}
        run: |
          for i in {1..60}; do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "Waiting for apt lock..."
            sleep 5
          done
          # TEST ONLY (do not merge): install without flashing, then flash with
          # tt-flash from tenstorrent/tt-flash#122 instead of the released pin.
          sudo env \
            GOLDEN_JSON="${GOLDEN_JSON}" \
            GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
            bash .github/scripts/golden-install.sh --hw

      - name: Flash firmware with tt-flash from tt-flash#122
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          VENV_DIR: /root/.tenstorrent-venv
          TT_FLASH_REF: 7867363a08ac3044b3665f576ee60cb2ab311079 # sbansal/glx_new_bmc_ipmi_reset
        run: |
          FW_VER="$(jq -r '.firmware' "${GOLDEN_JSON}")"
          FW_FILE="fw_pack-${FW_VER}.fwbundle"
          curl -fsSLO "https://github.com/tenstorrent/tt-system-firmware/releases/download/v${FW_VER}/${FW_FILE}"
          PKG="git+https://github.com/tenstorrent/tt-flash.git@${TT_FLASH_REF}"
          # The installer venv is usually built by uv and may have no pip.
          if sudo "${VENV_DIR}/bin/python" -m pip --version >/dev/null 2>&1; then
            sudo "${VENV_DIR}/bin/python" -m pip install --force-reinstall --no-deps "${PKG}"
          else
            sudo env PATH="/root/.local/bin:${PATH}" uv pip install \
              --python "${VENV_DIR}/bin/python" --reinstall --no-deps "${PKG}"
          fi
          sudo "${VENV_DIR}/bin/tt-flash" -v
          echo "Flashing firmware ${FW_VER} via tt-flash@${TT_FLASH_REF}"
          sudo "${VENV_DIR}/bin/tt-flash" flash "${FW_FILE}" --force

      - name: Verify installed smi matches golden.json
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          VENV_DIR: /root/.tenstorrent-venv
        run: sudo -E env GOLDEN_JSON="${GOLDEN_JSON}" VENV_DIR="${VENV_DIR}" bash .github/scripts/verify-versions.sh

      # A record, not a gate: BMC, BIOS, CPLD and chip firmware after the flash.
      # The platform-fw summary job compares them across hosts.
      - name: Record platform firmware (BMC, BIOS, CPLD, chip FW)
        env:
          VENV_DIR: /root/.tenstorrent-venv
          PLATFORM_FW_OUT: ${{ github.workspace }}/platform-fw/platform-fw-${{ matrix.runner }}.txt
        run: sudo -E env VENV_DIR="${VENV_DIR}" PLATFORM_FW_OUT="${PLATFORM_FW_OUT}" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY}" bash .github/scripts/platform-fw.sh

      - name: Return platform firmware record to the runner user
        if: always()
        run: |
          if [[ -e "${GITHUB_WORKSPACE}/platform-fw" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/platform-fw"
          fi

      - name: Upload platform firmware record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-fw-${{ matrix.runner }}
          path: ${{ github.workspace }}/platform-fw
          if-no-files-found: ignore

      - name: PCI reset stress (10x, installer tt-smi)
        env:
          VENV_DIR: /root/.tenstorrent-venv
          NUM_RESETS: "10"
          # smi-reset.sh selects tt-smi -glx_reset for galaxy labels; else -r.
          # Every runner compares NVMe/RAID health before and after each reset.
          GOLDEN_RUNNER_LABEL: ${{ matrix.label }}
          NVME_CHECK_ROOT: ${{ github.workspace }}/nvme-reset-check
        run: sudo -E env VENV_DIR="${VENV_DIR}" NUM_RESETS="${NUM_RESETS}" GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" NVME_CHECK_ROOT="${NVME_CHECK_ROOT}" bash .github/scripts/smi-reset.sh

      - name: Return reset artifacts to the runner user
        if: always()
        run: |
          if [[ -e "${GITHUB_WORKSPACE}/nvme-reset-check" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/nvme-reset-check"
          fi

      - name: Upload reset timing and NVMe check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvme-reset-check-${{ matrix.runner }}
          path: ${{ github.workspace }}/nvme-reset-check
          if-no-files-found: ignore

      - name: SMI snapshot (tt-smi -s)
        env:
          VENV_DIR: /root/.tenstorrent-venv
        run: sudo -E env VENV_DIR="${VENV_DIR}" bash .github/scripts/smi-snapshot.sh

      # - name: TTNN unit test (tt-metalium release container)
      #   timeout-minutes: 30
      #   env:
      #     GOLDEN_JSON: ${{ github.workspace }}/golden.json
      #     GOLDEN_RUNNER_LABEL: ${{ matrix.label }}
      #   run: |
      #     sudo -E env \
      #       GOLDEN_JSON="${GOLDEN_JSON}" \
      #       GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
      #       GITHUB_RUNNER_NAME="${GITHUB_RUNNER_NAME}" \
      #       bash .github/scripts/ttnn-unit-test.sh

      # Single-host suite. The super cluster nodes skip it: their multi-host
      # coverage is the SC4 fabric tests.
      - name: Metal upstream tests (upstream-tests-bh)
        if: matrix.label != 'super_cluster_bh_node'
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          GOLDEN_RUNNER_LABEL: ${{ matrix.label }}
          METAL_UPSTREAM_LOG: ${{ github.workspace }}/metal-upstream-${{ matrix.runner }}.log
        run: |
          sudo -E env \
            GOLDEN_JSON="${GOLDEN_JSON}" \
            GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
            GITHUB_RUNNER_NAME="${GITHUB_RUNNER_NAME}" \
            METAL_UPSTREAM_LOG="${METAL_UPSTREAM_LOG}" \
            bash .github/scripts/metal-upstream.sh

      - name: Upload metal upstream log
        if: ${{ always() && matrix.label != 'super_cluster_bh_node' }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-upstream-${{ matrix.runner }}-output
          path: ${{ github.workspace }}/metal-upstream-${{ matrix.runner }}.log
          if-no-files-found: warn

  # BH super cluster: eight rev C Galaxies, two SC4 quads. Same steps as above.
  golden-hw-sc:
    name: Golden hw (${{ matrix.runner }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.labels }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner has the pool label plus its hostname. a02u02 is also the
        # head node.
        include:
          - { runner: bh-glx-120-a02u02, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a02u02], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a02u08, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a02u08], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a03u02, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a03u02], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a03u08, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a03u08], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a04u02, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a04u02], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a04u08, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a04u08], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a05u02, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a05u02], label: super_cluster_bh_node }
          - { runner: bh-glx-120-a05u08, labels: [self-hosted, super_cluster_bh_node, bh-glx-120-a05u08], label: super_cluster_bh_node }
    steps: *node-steps

  platform-fw-summary:
    name: Platform firmware across hosts
    needs: [golden-hw-integration, golden-hw-sc]
    if: ${{ !cancelled() && (needs.golden-hw-integration.result != 'skipped' || needs.golden-hw-sc.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout golden versions repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download platform firmware records
        uses: actions/download-artifact@v4
        with:
          pattern: platform-fw-*
          path: platform-fw
          merge-multiple: true

      - name: Compare platform firmware across hosts
        run: python3 .github/scripts/platform-fw-summary.py platform-fw

  # Starts as soon as every super cluster node has installed, flashed and passed
  # its tests, so all of the super cluster is on the golden.json pins. Does not
  # wait for the single-host machines.
  sc4:
    name: SC4 cluster
    needs: golden-hw-sc
    uses: ./.github/workflows/golden-sc4-cluster.yml
    permissions:
      contents: read
