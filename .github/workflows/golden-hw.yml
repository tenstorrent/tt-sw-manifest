# Install golden stack on self-hosted runners, verify versions, stress-test tt-smi reset,
# ttnn unit test (tt-metalium release), and metal upstream (upstream-tests-bh).
# Runners mirror tenstorrent/tt-smi/.github/workflows/test.yml (test-hardware job).
#
# Runs on push to main / renovate/**, PRs touching golden files, workflow_dispatch,
# or when called by golden-release.yml.
# Self-hosted runners may log "sudo: unable to resolve host ubuntu" when hostname is not in
# /etc/hosts — harmless. To silence: echo "127.0.0.1 ubuntu" | sudo tee -a /etc/hosts
name: Golden — hardware
run-name: Golden hw · ${{ github.event_name }}${{ inputs.kmd_ref && format(' · tt-kmd {0}', inputs.kmd_ref) || '' }}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    paths:
      - golden.json
      - .github/workflows/golden-ttis.yml
      - .github/workflows/golden-hw.yml
      - .github/workflows/golden-release.yml
      - .github/workflows/renovate.yml
      - .github/scripts/**
      - tests/metalium-workload.py
  workflow_dispatch:
    inputs:
      kmd_ref:
        description: tt-kmd commit, tag, or branch to build and test instead of the golden KMD
        required: false
        type: string
      reason:
        description: Why you are running this workflow (optional)
        required: false
        type: string
  workflow_call:

concurrency:
  group: golden-hw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write # skip-duplicate-actions (query/cancel workflow runs)
  contents: read

jobs:
  # After a clean rebase+merge, main has the same tree as the PR tip. Skip the
  # post-merge push run when that PR (or any earlier run) already succeeded on
  # the same content. See fkirc/skip-duplicate-actions same_content_newer.
  # Later: add paths_ignore here if merge-only files should not force a re-run.
  pre_job:
    name: Skip duplicate check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.set.outputs.should_skip }}
    steps:
      - id: skip_check
        # Only consider skipping pushes (typically main after merge). Always run
        # on pull_request / workflow_dispatch / workflow_call (release gate).
        if: github.event_name == 'push'
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - id: set
        run: echo "should_skip=${{ steps.skip_check.outputs.should_skip || 'false' }}" >> "$GITHUB_OUTPUT"

  golden-hw-integration:
    name: Golden hw (${{ matrix.runner }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - p100a # syseng-gh-01
          - p150a # syseng-gh-03
          - p300a # yyz-zephyr-01

    steps:
      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install golden stack (tt-installer)
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
        run: |
          for i in {1..60}; do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "Waiting for apt lock..."
            sleep 5
          done
          echo "Flashing firmware to the golden.json pin via tt-flash"
          sudo env GOLDEN_JSON="${GOLDEN_JSON}" bash .github/scripts/golden-install.sh --hw --force-flash

      - name: Checkout requested tt-kmd
        if: inputs.kmd_ref != ''
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-kmd
          ref: ${{ inputs.kmd_ref }}
          path: tt-kmd-under-test

      - name: Build and install requested tt-kmd
        if: inputs.kmd_ref != ''
        env:
          REQUESTED_KMD_REF: ${{ inputs.kmd_ref }}
        run: |
          set -euo pipefail

          resolved_sha="$(git -C tt-kmd-under-test rev-parse HEAD)"
          echo "Building tt-kmd ${REQUESTED_KMD_REF} (${resolved_sha})"

          sudo apt-get update
          sudo apt-get install -y dpkg-dev dkms "linux-headers-$(uname -r)"
          (
            cd tt-kmd-under-test
            ./tools/build_debs.sh
          )

          mapfile -t packages < <(compgen -G "${GITHUB_WORKSPACE}/tt-kmd-under-test/tenstorrent-dkms_*.deb")
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one tenstorrent-dkms package, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-}"
            exit 1
          fi
          package="${packages[0]}"
          package_sha="$(sha256sum "${package}" | awk '{print $1}')"

          if lsmod | awk '$1 == "tenstorrent" { found=1 } END { exit !found }'; then
            sudo modprobe -r tenstorrent
          fi
          sudo apt-get remove -y tenstorrent-dkms
          sudo apt-get install -y "${package}"
          sudo modprobe tenstorrent
          sudo udevadm settle

          installed_version="$(dpkg-query -W -f='${Version}' tenstorrent-dkms)"
          dkms status tenstorrent
          modinfo tenstorrent

          # Subsequent verification must expect the package version actually
          # produced by this commit (for example, Debian maps "-pre" to "~pre").
          jq --arg version "${installed_version}" '.kmd = $version' golden.json > golden.json.tmp
          mv golden.json.tmp golden.json

          {
            echo "### tt-kmd under test"
            echo "- Requested ref: \`${REQUESTED_KMD_REF}\`"
            echo "- Resolved commit: \`${resolved_sha}\`"
            echo "- Package version: \`${installed_version}\`"
            echo "- Package SHA-256: \`${package_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify installed stack matches golden.json
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          VENV_DIR: /root/.tenstorrent-venv
        run: sudo -E env GOLDEN_JSON="${GOLDEN_JSON}" VENV_DIR="${VENV_DIR}" bash .github/scripts/verify-versions.sh

      - name: PCI reset stress (10x, installer tt-smi)
        env:
          VENV_DIR: /root/.tenstorrent-venv
          NUM_RESETS: "10"
        run: sudo -E env VENV_DIR="${VENV_DIR}" NUM_RESETS="${NUM_RESETS}" bash .github/scripts/smi-reset.sh

      - name: TTNN unit test (tt-metalium release container)
        timeout-minutes: 30
        env:
          GOLDEN_JSON: ${{ github.workspace }}/golden.json
          GOLDEN_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          sudo -E env \
            GOLDEN_JSON="${GOLDEN_JSON}" \
            GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
            GITHUB_RUNNER_NAME="${GITHUB_RUNNER_NAME}" \
            bash .github/scripts/ttnn-unit-test.sh

      #  Commenting this out for now - this will depend on the type of runner
      # - name: Metal upstream tests (upstream-tests-bh)
      #   timeout-minutes: 120
      #   env:
      #     GOLDEN_JSON: ${{ github.workspace }}/golden.json
      #     GOLDEN_RUNNER_LABEL: ${{ matrix.runner }}
      #   run: |
      #     sudo -E env \
      #       GOLDEN_JSON="${GOLDEN_JSON}" \
      #       GOLDEN_RUNNER_LABEL="${GOLDEN_RUNNER_LABEL}" \
      #       GITHUB_RUNNER_NAME="${GITHUB_RUNNER_NAME}" \
      #       bash .github/scripts/metal-upstream.sh
