# Install the golden.json stack in each distro container (no hardware), capture
# the installed versions with tt-installer --export-schema into a per-distro
# .ttis file, and verify it.
#
# The exported .ttis is the release artifact: tenstorrent-tools and sfpi versions
# come from what actually installed; firmware is recorded from golden.json as
# assumed-flashed (CI has no device to flash). Publishing is manual via golden-release.yml.
name: Golden — ttis
run-name: Golden ttis · ${{ github.event_name }}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    paths:
      - golden.json
      - .github/workflows/golden-ttis.yml
      - .github/workflows/golden-hw.yml
      - .github/workflows/golden-release.yml
      - .github/workflows/renovate.yml
      - .github/scripts/**
      - tests/metalium-workload.py
  workflow_dispatch:
  workflow_call:

concurrency:
  group: golden-ttis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write # skip-duplicate-actions (query/cancel workflow runs)
  contents: read

jobs:
  # After a clean rebase+merge, main has the same tree as the PR tip. Skip the
  # post-merge push run when that PR (or any earlier run) already succeeded on
  # the same content. See fkirc/skip-duplicate-actions same_content_newer.
  # Later: add paths_ignore here if merge-only files should not force a re-run.
  pre_job:
    name: Skip duplicate check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.set.outputs.should_skip }}
    steps:
      - id: skip_check
        # Only consider skipping pushes (typically main after merge). Always run
        # on pull_request / workflow_dispatch / workflow_call (release gate).
        if: github.event_name == 'push'
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - id: set
        run: echo "should_skip=${{ steps.skip_check.outputs.should_skip || 'false' }}" >> "$GITHUB_OUTPUT"

  build-test:
    name: Install + export + test (${{ matrix.slug }})
    needs: pre_job
    # Throwaway tt-smi Galaxy test branch — skip distro/.ttis matrix.
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", slug: "ubuntu-22.04" }
          - { image: "ubuntu:24.04", slug: "ubuntu-24.04" }
          - { image: "debian:13", slug: "debian-13" }
          - { image: "fedora:43", slug: "fedora-43" }

    steps:
      - name: Checkout golden versions repo
        uses: actions/checkout@v4

      - name: Install + export + test .ttis in ${{ matrix.image }}
        run: |
          # Uses tenstorrent/tt-installer at golden.json's `installer` pin
          # (override with INSTALLER_REPO / INSTALLER_TAG if needed).
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash /workspace/.github/scripts/ci-container-bootstrap.sh

      - name: Upload exported .ttis
        uses: actions/upload-artifact@v4
        with:
          name: ttis-${{ matrix.slug }}
          path: dist/*.ttis
          if-no-files-found: error
